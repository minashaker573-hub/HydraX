<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>HYDRAX — Irrigation that decides at the edge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1116" />
      <stop offset="100%" stop-color="#0a1a26" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- droplet mark -->
  <path
    d="M150 118 C150 118 230 218 230 274 a80 80 0 0 1-160 0 C70 218 150 118 150 118Z"
    fill="#5aa9f5"
  />

  <text x="150" y="380" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="78" font-weight="700" letter-spacing="6" fill="#f4f7f5">HYDRAX</text>
  <text x="150" y="428" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="24" letter-spacing="1" fill="#8a99a3">SmartFarm Guardian</text>

  <text x="150" y="500" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="34" fill="#bccad2">The decision to water happens in the field.</text>

  <g font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="16" letter-spacing="2" fill="#5aa9f5">
    <text x="150" y="548">EDGE-CONTROLLED IRRIGATION</text>
  </g>
</svg>
