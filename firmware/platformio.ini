; HYDRAX / SmartFarm Guardian - Phase 1 firmware
;
;   pio run -e esp32dev              build device firmware
;   pio run -e esp32dev -t upload    flash the board
;   pio device monitor               view logs
;   pio test -e native               run the core logic tests on the host
;
; The `native` environment compiles ONLY src/core, which is free of Arduino
; dependencies. That separation is what makes the irrigation logic testable
; without hardware.

[platformio]
default_envs = esp32dev

[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11

; ---------------------------------------------------------------------------
; Device build
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*>
build_flags =
    ${env.build_flags}
    -I src
    -D HYDRAX_DEVICE_ID=\"HYDRAX-001\"

; Same firmware, synthetic sensor data. Use when the board is on the bench
; with no probes wired. Telemetry is tagged `simulated: true`.
[env:esp32dev_sim]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D HYDRAX_SIMULATE

; ---------------------------------------------------------------------------
; Host test build
; ---------------------------------------------------------------------------
; Only the pure core is compiled here; src/hal/esp32_* , src/net and main.cpp
; are excluded because they need the Arduino framework.
[env:native]
platform = native
test_framework = custom
build_src_filter = +<core/*>
build_flags =
    ${env.build_flags}
    -I src
    -D HYDRAX_DEVICE_ID=\"HYDRAX-TEST\"
