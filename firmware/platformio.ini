; HYDRAX / SmartFarm Guardian - Phase 1 firmware
;
;   pio run -e esp32dev              build device firmware
;   pio run -e esp32dev -t upload    flash the board
;   pio device monitor               view logs
;   pio test -e native               run the core logic tests on the host
;
; The `native` environment compiles ONLY src/core, which is free of Arduino
; dependencies. That separation is what makes the irrigation logic testable
; without hardware.

[platformio]
default_envs = esp32dev

[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11

; ---------------------------------------------------------------------------
; Device build
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; The commissioning console is a separate image and must never be linked into
; the production firmware - it defines its own setup()/loop().
build_src_filter = +<*> -<commissioning/*>
build_flags =
    ${env.build_flags}
    -I src
    -D HYDRAX_DEVICE_ID=\"HYDRAX-001\"

; Same firmware, synthetic sensor data. Use when the board is on the bench
; with no probes wired. Telemetry is tagged `simulated: true`.
[env:esp32dev_sim]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D HYDRAX_SIMULATE

; Bench profile: real irrigation logic with compressed safety timings so a full
; start/stop/timeout/cooldown cycle can be observed in about a minute.
; NEVER DEPLOY THIS IMAGE - it shortens the maximum runtime cut-off.
[env:esp32dev_bench]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D HYDRAX_BENCH_TIMING

; ---------------------------------------------------------------------------
; Hardware commissioning console (Phase 1A bring-up)
; ---------------------------------------------------------------------------
; Interactive serial tool for verifying sensors and actuators individually
; BEFORE trusting the irrigation state machine with them. Reuses the production
; sensor and actuator layers unchanged; contains no irrigation logic.
;
;   pio run -e esp32dev_commission -t upload && pio device monitor
[env:esp32dev_commission]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env.build_flags}
    -I src
    -D HYDRAX_DEVICE_ID=\"HYDRAX-COMMISSION\"

; ---------------------------------------------------------------------------
; Host test build
; ---------------------------------------------------------------------------
; Only the pure core is compiled here; src/hal/esp32_* , src/net and main.cpp
; are excluded because they need the Arduino framework.
[env:native]
platform = native
; The core suite is a self-contained C++ program with its own assertion
; harness, so PlatformIO needs the runner in test/test_custom_runner.py to
; interpret its output. The same suite still builds with a plain compiler and
; no PlatformIO at all - see docs/TESTING.md.
test_framework = custom
; Without this PlatformIO compiles only test/, and the core objects never make
; it into the link.
test_build_src = yes
build_src_filter = +<core/*>
build_flags =
    ${env.build_flags}
    -I src
    -D HYDRAX_DEVICE_ID=\"HYDRAX-TEST\"
