<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HYDRAX — Farm Monitoring &amp; Control</title>
    <meta
      name="description"
      content="HYDRAX SmartFarm Guardian - soil moisture, irrigation control and device health."
    />
    <!-- Live telemetry, not marketing copy — nothing here is meant to rank. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="/dashboard/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f6fd1'/><path d='M50 18 C50 18 74 46 74 62 a24 24 0 0 1-48 0 C26 46 50 18 50 18Z' fill='white'/></svg>"
    />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <!-- Dims the page behind the mobile nav drawer; also closes it on tap. -->
    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <div class="shell">
      <!-- ============ sidebar ============ -->
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 14 C50 14 76 44 76 62 a26 26 0 0 1-52 0 C24 44 50 14 50 14Z" />
          </svg>
          <div class="brand-text">
            <span class="brand-name">HYDRAX</span>
            <span class="brand-sub" data-i18n="brand.tagline">Intelligent Irrigation &amp; Monitoring System</span>
          </div>
        </div>

        <!-- Mobile only: the topbar has no room for this once the hamburger
             and notification button are both present, so it lives in the
             drawer instead. Same buttons, same data-lang attributes — app.js
             keeps every matching control in sync. -->
        <div class="lang-toggle lang-toggle-sidebar" role="group" data-i18n-aria-label="common.language" aria-label="Language">
          <button class="lang-btn" type="button" data-lang="en">EN</button>
          <button class="lang-btn" type="button" data-lang="ar">AR</button>
        </div>

        <nav class="nav" aria-label="Sections">
          <button class="nav-item" data-view="overview" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5M6 10v9h5v-5h2v5h5v-9" /></svg>
            </span>
            <span class="nav-label" data-i18n="nav.overview">Overview</span>
          </button>
          <button class="nav-item" data-view="irrigation" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 12 3 12 3Z" /></svg>
            </span>
            <span class="nav-label" data-i18n="nav.irrigation">Smart Irrigation</span>
          </button>
          <button class="nav-item" data-view="pump" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 8v4l3 2" /></svg>
            </span>
            <span class="nav-label" data-i18n="nav.pump">Pump Health</span>
          </button>
          <button class="nav-item" data-view="water" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6" /></svg>
            </span>
            <span class="nav-label" data-i18n="nav.water">Water Network</span>
          </button>
          <button class="nav-item" data-view="safety" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z" /></svg>
            </span>
            <span class="nav-label" data-i18n="nav.safety">Safety Center</span>
          </button>
          <button class="nav-item" data-view="alerts" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3a5 5 0 0 0-5 5v3l-2 4h14l-2-4V8a5 5 0 0 0-5-5Z" /><path d="M9.5 19a2.5 2.5 0 0 0 5 0" /></svg>
            </span>
            <span class="nav-label" data-i18n="nav.alerts">Alerts &amp; Events</span>
            <span class="nav-count" id="nav-alert-count" hidden></span>
          </button>
          <button class="nav-item" data-view="device" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" /><path d="M9 7h6M9 11h6M9 15h3" /></svg>
            </span>
            <span class="nav-label" data-i18n="nav.device">Device</span>
          </button>
        </nav>

        <div class="sidebar-foot">
          <p class="sidebar-foot-label" data-i18n="sidebar.deviceStatus">DEVICE STATUS</p>
          <p class="sidebar-foot-status">
            <span class="status-dot" id="device-status-dot" aria-hidden="true"></span>
            <span id="device-status-text">—</span>
          </p>
          <p class="sidebar-foot-meta" id="device-last-contact"></p>
          <p class="sidebar-foot-note" data-i18n="sidebar.monitorOnly">
            Irrigation decisions are made on the controller. This dashboard monitors — it is never in the control path.
          </p>
        </div>
      </aside>

      <!-- ============ main ============ -->
      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="icon-button nav-toggle"
              id="nav-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="sidebar"
              data-i18n-aria-label="common.menu"
              aria-label="Menu"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
            <h1 class="view-title" id="view-title">Overview</h1>
            <span class="source-badge" id="source-badge" hidden></span>
          </div>
          <div class="topbar-right">
            <button
              class="icon-button notif-button"
              id="notif-button"
              type="button"
              data-i18n-aria-label="common.notifications"
              aria-label="Notifications"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a5 5 0 0 0-5 5v3l-2 4h14l-2-4V8a5 5 0 0 0-5-5Z" /><path d="M9.5 19a2.5 2.5 0 0 0 5 0" /></svg>
              <span class="notif-count" id="notif-count" hidden></span>
            </button>

            <!-- Real dashboard-link state, restyled as a compact status chip
                 instead of bare text — same signal as before (see app.js),
                 just given the visual weight the reference gives this slot. -->
            <div class="system-chip" id="system-chip">
              <span class="system-chip-label" data-i18n="topbar.system">System</span>
              <span class="system-chip-status">
                <span class="status-dot" id="topbar-status-dot" aria-hidden="true"></span>
                <span id="topbar-status-text" aria-live="polite">—</span>
              </span>
            </div>

            <div class="lang-toggle lang-toggle-topbar" role="group" data-i18n-aria-label="common.language" aria-label="Language">
              <button class="lang-btn" type="button" data-lang="en">EN</button>
              <button class="lang-btn" type="button" data-lang="ar">AR</button>
            </div>
          </div>
        </header>

        <main class="view" id="view" tabindex="-1">
          <p class="placeholder">Loading system state…</p>
        </main>
      </div>
    </div>

    <script type="module" src="/dashboard/js/app.js"></script>
  </body>
</html>
